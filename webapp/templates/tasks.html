{% extends "base.html" %}
{% block title %}课程任务 · {{ app_name }}{% endblock %}
{% block content %}
<div x-data="tasksPage()">
    <div class="error-banner danger" x-show="actionError" x-text="actionError" x-cloak role="alert"></div>

    <header class="page-head">
        <div>
            <div class="page-eyebrow">// 操作 · 03</div>
            <h1 class="page-title">课程任务</h1>
            <p class="page-sub">查看处理进度与分类结果，打开任务详情查看实时日志。</p>
        </div>
        <div class="page-actions">
            <button class="btn btn-ghost" @click="refresh()">
                <span class="glyph">↻</span>
                <span>刷新</span>
            </button>
        </div>
    </header>

    <div style="margin-bottom:14px;display:flex;align-items:center;gap:12px"><input type="search" class="input" x-model="search" aria-label="筛选任务" placeholder="搜索最近 100 个任务的账号、课程或编号" style="max-width:360px"><span class="muted" style="font-size:12px" x-text="`${filteredTasks().length} 个任务`"></span></div>
    <section class="panel bracketed">
        <div class="row-list">
            <div class="row row-head row-tasks">
                <span>编号</span>
                <span>账号</span>
                <span>状态</span>
                <span>处理进度 / 结果</span>
                <span>焦点</span>
                <span>启动时间</span>
                <span style="text-align: right;">操作</span>
            </div>
            <template x-for="t in filteredTasks()" :key="t.id">
                <div class="row row-tasks">
                    <span class="col-id" x-text="`#${String(t.id).padStart(3,'0')}`"></span>
                    <span class="col-name" x-text="phoneOf(t.account_id)"></span>
                    <span class="flex-col" style="gap: 4px;">
                        <span class="tag" :class="tagClass(t.status)" x-text="window.taskStatusLabel(t.status)"></span>
                        <span class="tag" :class="t.mode === 'quick' ? 'tag-quick' : 'tag-normal'"
                              style="font-size: 0.6rem; letter-spacing: 0.18em;"
                              x-text="t.mode === 'quick' ? 'quick' : 'normal'"></span>
                    </span>
                    <span class="flex-col" style="gap: 4px;">
                        <span class="progress-ascii" x-text="window.fmtAscii(t.done_chapters, t.total_chapters, 18)"
                              :style="t.status === 'failed' ? 'color: var(--crimson);' : t.status === 'cancelled' ? 'color: var(--bone-mute);' : ''"></span>
                        <span class="muted tabular" style="font-size: 0.7rem;"
                              x-text="`${t.done_chapters}/${t.total_chapters} · ${window.fmtPct(t.done_chapters,t.total_chapters)}%`"></span>
                        <span class="muted tabular" style="font-size: 0.7rem;" x-text="window.taskResultSummary(t)"></span>
                    </span>
                    <span class="flex-col" style="gap: 2px; min-width: 0;">
                        <span x-text="t.current_chapter || '—'" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
                        <span class="muted serif" style="font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                              x-text="t.current_course || ''"></span>
                    </span>
                    <span class="muted tabular" style="font-size: 0.75rem;"
                          x-text="t.started_at ? window.fmtTime(t.started_at) : '—'"></span>
                    <span class="col-actions">
                        <a class="btn btn-ghost btn-sm" :href="`/tasks/${t.id}`">
                            <span class="glyph">→</span>
                            <span>打开</span>
                        </a>
                        <button class="btn btn-ghost btn-sm" style="color: var(--crimson);"
                                x-show="['pending','running'].includes(t.status)"
                                @click="cancel(t)" title="中止">
                            <span class="glyph">×</span>
                        </button>
                    </span>
                </div>
            </template>
            <div class="empty" x-show="filteredTasks().length === 0">
                <span x-text="search ? '没有匹配的任务，请调整搜索条件' : '暂无任务，选择学习通账号后即可创建'"></span>
            </div>
        </div>
    </section>
</div>

<script>
function tasksPage() {
    return actionPage({
        tasks: [],
        accounts: [],
        search: '',
        async init() {
            this.search = new URLSearchParams(window.location.search).get('q') || '';
            await this.refresh();
            setInterval(() => this.runAction('refresh'), 3000);
        },
        async refresh() {
            const tRes = await apiFetch('/api/tasks?limit=100').then(r => r.json());
            const aRes = await apiFetch('/api/accounts').then(r => r.json());
            this.tasks = tRes;
            this.accounts = aRes;
        },
        phoneOf(id) {
            const a = this.accounts.find(x => x.id === id);
            return a ? (a.nickname || a.phone) : `#${id}`;
        },
        filteredTasks() {
            const query = this.search.trim().toLowerCase();
            return this.tasks.filter(t => !query || [t.id, this.phoneOf(t.account_id), t.current_course, t.current_chapter, window.taskStatusLabel(t.status)].join(' ').toLowerCase().includes(query));
        },
        tagClass(s) {
            return ({
                pending:   'tag-pending',
                running:   'tag-running',
                completed: 'tag-success',
                partial:   'tag-warn',
                failed:    'tag-fail',
                cancelled: 'tag-cancel',
            })[s] || 'tag-pending';
        },
        async cancel(t) {
            if (!confirm(`确定取消任务 #${t.id}?`)) return;
            const res = await apiFetch(`/api/tasks/${t.id}/cancel`, {method: 'POST'});
            const j = await res.json();
            showToast(j.msg || '已取消', j.status ? 'success' : 'warning');
            await this.refresh();
        },
    });
}
</script>
{% endblock %}
