{% extends "base.html" %}
{% block title %}我的学习通账号 · {{ app_name }}{% endblock %}
{% block content %}
<div x-data="userAccountsPage()" x-init="init()">
    <header class="page-head">
        <div>
            <div class="page-eyebrow">// MY ACCOUNTS · 02</div>
            <h1 class="page-title">学习通账号 <span class="serif" style="color: var(--bone-mute);">— 我的身份。</span></h1>
            <p class="page-sub">添加并管理你自己的学习通账号，账号只归属于当前平台用户。</p>
        </div>
        <div class="page-actions">
            <button class="btn btn-primary" @click="openCreate">
                <span class="glyph">+</span>
                <span>添加学习通账号</span>
            </button>
        </div>
    </header>

    <section class="panel bracketed">
        <div class="row-list">
            <div class="row row-head row-accounts">
                <span>编号</span>
                <span>账号</span>
                <span>昵称</span>
                <span>状态</span>
                <span>最后登录</span>
                <span style="text-align: right;">操作</span>
            </div>
            <template x-for="a in accounts" :key="a.id">
                <div class="row row-accounts">
                    <span class="col-id" x-text="`#${String(a.id).padStart(3,'0')}`"></span>
                    <span class="col-name tabular" x-text="a.phone"></span>
                    <span class="muted serif" x-text="a.nickname || '—'"></span>
                    <span>
                        <span class="tag" :class="acctTag(a.status)" x-text="a.status"></span>
                        <span x-show="a.last_error" class="muted" style="font-size: 0.7rem; display: block; margin-top: 4px;" x-text="a.last_error"></span>
                    </span>
                    <span class="muted tabular" style="font-size: 0.75rem;" x-text="a.last_login_at ? window.fmtTime(a.last_login_at) : '—'"></span>
                    <span class="col-actions">
                        <a class="btn btn-ghost btn-sm" :href="`/user/accounts/${a.id}/courses`">
                            <span class="glyph">⌘</span>
                            <span>课程</span>
                        </a>
                        <button class="btn btn-ghost btn-sm" @click="relogin(a)">
                            <span class="glyph">↻</span>
                        </button>
                        <button class="btn btn-ghost btn-sm" @click="remove(a)" style="color: var(--crimson);">
                            <span class="glyph">×</span>
                        </button>
                    </span>
                </div>
            </template>
            <div class="empty" x-show="accounts.length === 0">
                还没有学习通账号<br>
                <span style="font-size: 0.78rem; font-family: var(--mono); font-style: normal;">添加账号后即可同步课程并创建任务</span>
            </div>
        </div>
    </section>

    <template x-teleport="body">
        <div class="modal-backdrop" x-show="creating" x-transition.opacity
             data-modal-open="true" @modal-escape.window="creating = false"
             @click.self="creating = false" style="display: none;">
            <div class="modal" @click.stop>
                <div class="modal-head">
                    <div class="modal-title"><span class="num">+</span>添加学习通账号</div>
                    <button type="button" class="modal-close" @click="creating = false">×</button>
                </div>
                <form @submit.prevent="submitCreate">
                    <div class="modal-body">
                        <div class="field">
                            <label class="field-label">学习通账号</label>
                            <input type="text" class="input" x-model="form.phone" required placeholder="手机号 / 学习通账号">
                        </div>
                        <div class="field">
                            <label class="field-label">密码</label>
                            <input type="password" class="input" x-model="form.password" required placeholder="学习通密码">
                        </div>
                        <div class="field">
                            <label class="field-label">备注昵称</label>
                            <input type="text" class="input" x-model="form.nickname" placeholder="例如：我的账号">
                        </div>
                        <label class="checkbox">
                            <input type="checkbox" x-model="form.verify_login">
                            <span class="checkbox-mark"></span>
                            <span>保存后立即测试登录并获取昵称</span>
                        </label>
                    </div>
                    <div class="modal-foot">
                        <button type="button" class="btn btn-ghost" @click="creating = false">取消</button>
                        <button type="submit" class="btn btn-primary" :disabled="submitting">
                            <span x-show="!submitting">保存</span>
                            <span x-show="submitting" class="spinner"></span>
                            <span x-show="submitting">验证中…</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </template>
</div>

<script>
function userAccountsPage() {
    return {
        accounts: [],
        form: {phone: '', password: '', nickname: '', verify_login: true},
        creating: false,
        submitting: false,
        async init() { await this.refresh(); },
        async refresh() {
            this.accounts = await fetch('/api/accounts').then(r => r.json()).catch(() => []);
        },
        openCreate() {
            this.form = {phone: '', password: '', nickname: '', verify_login: true};
            this.creating = true;
        },
        async submitCreate() {
            this.submitting = true;
            try {
                const res = await fetch('/api/accounts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(this.form),
                });
                const j = await res.json().catch(() => ({}));
                if (res.ok) {
                    showToast(j.status === 'error' ? (j.last_error || '登录检测失败，账号已保存') : '学习通账号已添加', j.status === 'error' ? 'warning' : 'success');
                    this.creating = false;
                    await this.refresh();
                } else {
                    showToast(j.detail || '添加失败', 'danger');
                }
            } finally {
                this.submitting = false;
            }
        },
        async relogin(a) {
            showToast(`正在检测 ${a.phone} …`, 'info');
            const res = await fetch(`/api/accounts/${a.id}/login`, {method: 'POST'});
            const j = await res.json().catch(() => ({}));
            showToast(j.msg || '检测完成', j.status ? 'success' : 'danger');
            await this.refresh();
        },
        async remove(a) {
            if (!confirm(`确定删除学习通账号 ${a.phone}？`)) return;
            const res = await fetch(`/api/accounts/${a.id}`, {method: 'DELETE'});
            showToast(res.ok ? '已删除' : '删除失败', res.ok ? 'success' : 'danger');
            await this.refresh();
        },
        acctTag(s) {
            return ({idle: 'tag-pending', running: 'tag-running', error: 'tag-fail'})[s] || 'tag-pending';
        },
    };
}
</script>
{% endblock %}
