{% extends "base.html" %}
{% block title %}管理员登录 · {{ app_name }}{% endblock %}
{% block auth_content %}
<div class="auth-card">
    <div class="brand-logo" style="margin-bottom:20px">{{ icon('book') }}</div>
    <div class="auth-eyebrow">超星学习通 · 管理员入口</div>
    <h1 class="auth-title">欢迎回来</h1>
    <p class="auth-sub">登录控制台，管理账号、课程任务与平台配置。</p>

    <form class="auth-form" x-data="{busy:false}" x-on:submit.prevent="
        const fd = new FormData($event.target);
        busy = true;
        apiFetch('/api/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({password: fd.get('password')})
        }).then(r => r.json().then(j => ({ok: r.ok, j})))
          .then(({ok, j}) => {
              if (ok) location.href = '/dashboard';
              else showToast(j.detail || '登录失败', 'danger');
          }).catch(error => showToast(error.message, 'danger')).finally(() => busy = false);
    ">
        <div class="field">
            <label class="field-label">密码</label>
            <input type="password" class="input" name="password" required autofocus
                   placeholder="• • • • • • • •">
        </div>
        <button type="submit" class="btn btn-primary btn-block" :disabled="busy">
            <span>登录控制台</span>
            <span class="glyph">→</span>
        </button>
    </form>

    <div class="auth-foot"><a href="/">返回首页</a> · <a href="/login">用户登录</a></div>
</div>
{% endblock %}
